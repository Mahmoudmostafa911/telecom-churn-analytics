name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-smoke-run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest tests -q

      - name: Build synthetic fixture + telemetry (no network access needed)
        run: |
          python data/make_synthetic_fixture.py
          python data/generate_network_kpis.py --customers data/raw/telco_synthetic_fixture.csv

      - name: Smoke-run the full pipeline on the fixture
        env:
          PYTHONPATH: src
        run: python -m telco_churn run --fixture

      - name: Assert artefacts exist
        run: |
          test -f data/processed/star/fact_customer.csv
          test -f data/processed/dq_results.csv
          test -f model/metrics.json
          test -f docs/findings.md
          python - <<'PY'
          import json, pandas as pd
          dq = pd.read_csv("data/processed/dq_results.csv")
          assert not (dq["status"] == "FAIL").any(), dq[dq.status == "FAIL"]
          m = json.load(open("model/metrics.json"))
          assert m["customer"]["roc_auc_test"] > 0.75, m["customer"]["roc_auc_test"]
          print("CI checks passed:", dq["status"].value_counts().to_dict(), "AUC", m["customer"]["roc_auc_test"])
          PY

      - name: Upload run artefacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artefacts-py${{ matrix.python-version }}
          path: |
            docs/findings.md
            docs/img/*.png
            model/metrics.json
            data/processed/dq_results.csv
