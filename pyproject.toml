[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn-analytics"
version = "1.0.0"
description = "Telecom churn & network quality analytics — Python, SQL, Power BI"
authors = [{ name = "Mahmoud Mostafa" }]
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4"]
dev = ["pytest>=8.0", "jupyter>=1.0", "seaborn>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
